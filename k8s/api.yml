apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ai-lab
spec:
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ai-api:0.1
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            periodSeconds: 10