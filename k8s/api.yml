apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ai-lab
spec:
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ai-api:0.1
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            periodSeconds: 10
---        
apiVersion: v1
kind: Service                # a Service: a stable name and address for pods
metadata:
  name: api              # this name becomes the DNS name: http://whisper
  namespace: ai-lab
spec:
  selector:                  # which pods to send traffic to...
    app: api           # ...pods labelled app=whisper
  ports:
    - port: 80             # the port callers use on the Service
      targetPort: 5000       # the port on the pod that traffic goes to