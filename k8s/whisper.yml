apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper
  namespace: ai-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisper
  template:
    metadata:
      labels:
        app: whisper
    spec:
      containers:
        - name: whisper
          image: onerahmet/openai-whisper-asr-webservice:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ASR_MODEL
              value: tiny
          ports:
            - containerPort: 9000
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1536Mi"
          startupProbe:
            httpGet:
              path: /docs
              port: 9000
            periodSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: whisper
  namespace: ai-lab
spec:
  selector:
    app: whisper
  ports:
    - port: 9000
      targetPort: 9000